# Monte Carlo of coverage and size, mid profile: the mc_full.toml grid with
# boot_reps = 2500 (SE of a 95% coverage cell about 0.44 points, enough to resolve a
# 1-point shortfall; mc-quick's 500 gives about 1 point). See docs/DESIGN.md section 6.4.
# Timing pilot 2026-11-21 (results/mc-mid/calibration.json, 4 workers, shared machine):
# 2,200 CPU-minutes (coverage 1,169, difference 64, dsr 968), about 550 wall-minutes on 4
# workers; no cuts applied yet, not run. Cut order if a session budget requires it:
# reps 10000 -> 5000 (non-bootstrap methods), [difference] reps
# 5000 -> 2500, [dsr] reps 5000 -> 2500, then nobs 2520 dropped. Never boot_reps < 2500.
#   uv run sharpecheck mc pilot --config configs/mc_mid.toml --workers 4
#   uv run sharpecheck mc run --config configs/mc_mid.toml --workers 4 --max-minutes 40
name = "mc-mid"
seed = 20261024
level = 0.95
chunk = 500

[coverage]
dgps = ["normal", "t5", "garch-t7", "ar1-0.2", "regime", "crash"]
sr = [0.0, 0.1, 0.3, 0.5]
nobs = [60, 120, 250, 500, 1000, 2520]
methods = ["iid_normal", "exact_nct", "mertens", "ar1", "hac", "hac_pw", "boot_ts"]
reps = 10000
boot_reps = 2500
n_boot = 999
block = "cube-root"
psr_variants = ["observed", "null"]

[difference]
dgps = ["normal-iid", "t6-iid", "normal-garch", "t6-garch", "normal-var", "t6-var"]
nobs = 120
reps = 5000
n_boot = 499
methods = [
    "jkm", "hac", "hac_pw", "boot_iid",
    "boot_ts_b2", "boot_ts_b4", "boot_ts_b6", "boot_ts_b8", "boot_ts_b10",
]
alphas = [0.01, 0.05, 0.10]

[dsr]
n_trials = [10, 100, 1000, 10000]
rho = [0.0, 0.3, 0.7]
nobs = [250, 1250]
dists = ["normal", "t5"]
reps = 5000
rules = [
    "dsr_trueN_estV", "dsr_trueN_oracleV", "dsr_N/10", "dsr_impliedN",
    "psr_best", "holm_psr", "lzl_max",
]
alpha = 0.05

[run]
workers = 3
out_dir = "runs/mc-mid"
